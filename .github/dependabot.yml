version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one weekly pull request.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions are adopted deliberately, in their own change:
    # embedded-postgres tracks Supabase's Postgres (17), @types/node tracks the Node
    # the app runs on (22), and the database driver and compiler need their own review.
    ignore:
      - dependency-name: embedded-postgres
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
